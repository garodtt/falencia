<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Falência: Goblins</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-hat" viewBox="0 0 24 24">
          <path d="M3 20h18M7 20l4-15c.3-1 1.7-1 2 0l4 15" />
          <path d="M9 13h6" />
        </symbol>
        <symbol id="i-beard" viewBox="0 0 24 24">
          <path d="M5 8c0 7 3 12 7 12s7-5 7-12" />
          <path d="M9 13c1 1 5 1 6 0" />
        </symbol>
        <symbol id="i-glasses" viewBox="0 0 24 24">
          <circle cx="7" cy="14" r="3.5" />
          <circle cx="17" cy="14" r="3.5" />
          <path d="M10.5 14h3M3.5 14L2 9M20.5 14L22 9" />
        </symbol>
        <symbol id="i-sandal" viewBox="0 0 24 24">
          <path d="M8 3c3 0 5 3 5 8s-1 10-4 10-4-4-4-9 0-9 3-9z" />
          <path d="M6 11c2-1 4-1 6.5 0M9.5 5l-1 6" />
        </symbol>
        <symbol id="i-spiral" viewBox="0 0 24 24">
          <path d="M12 12a1.5 1.5 0 1 1 1.5-1.5A3.5 3.5 0 1 1 10 7a5.5 5.5 0 1 1-4 9" />
        </symbol>
        <symbol id="i-wart" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" />
          <circle cx="12" cy="12" r="2.5" />
        </symbol>
        <symbol id="i-cards" viewBox="0 0 24 24">
          <rect x="4" y="6" width="11" height="15" rx="2" />
          <path d="M8 3h10a2 2 0 0 1 2 2v13" />
        </symbol>
        <symbol id="i-bag" viewBox="0 0 24 24">
          <path d="M5 8h14l-1 12H6z" />
          <path d="M9 8a3 3 0 0 1 6 0" />
        </symbol>
        <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z" /></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24">
          <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </symbol>
        <symbol id="i-skull" viewBox="0 0 24 24">
          <path d="M5 11a7 7 0 1 1 14 0v3l-2 1v3H7v-3l-2-1z" />
          <circle cx="9.2" cy="11.5" r="1.6" />
          <circle cx="14.8" cy="11.5" r="1.6" />
          <path d="M10 18v-2M14 18v-2M12 14.5l-.8 1.2h1.6z" />
        </symbol>
        <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" /></symbol>
        <symbol id="i-book" viewBox="0 0 24 24">
          <path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z" />
          <path d="M4 19V5" />
        </symbol>
        <symbol id="i-list" viewBox="0 0 24 24">
          <path d="M8 6h12M8 12h12M8 18h12M4 6h0M4 12h0M4 18h0" />
        </symbol>
        <symbol id="i-grave" viewBox="0 0 24 24">
          <path d="M7 21V10a5 5 0 0 1 10 0v11" />
          <path d="M4 21h16M10 12h4M12 10v5" />
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24">
          <path d="M12 3l10 18H2z" />
          <path d="M12 10v5M12 18h0" />
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v6M12 7.5h0" />
        </symbol>
        <symbol id="i-bot" viewBox="0 0 24 24">
          <rect x="5" y="8" width="14" height="11" rx="3" />
          <path d="M12 4v4M9 13h0M15 13h0M9 16h6" />
        </symbol>
        <symbol id="i-gauge" viewBox="0 0 24 24">
          <path d="M4 16a8 8 0 1 1 16 0" />
          <path d="M12 16l4-5" />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path d="M4 11l8-7 8 7v9H4z" />
          <path d="M10 20v-5h4v5" />
        </symbol>
        <symbol id="i-users" viewBox="0 0 24 24">
          <circle cx="9" cy="8" r="3.5" />
          <path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6" />
          <path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .7 3 2.8 3 6" />
        </symbol>
        <symbol id="i-swords" viewBox="0 0 24 24">
          <path d="M4 4l9 9M20 4l-9 9M6 16l-2 4M18 16l2 4M8 14l2 2M16 14l-2 2" />
        </symbol>
      </defs>
    </svg>
    <header class="bar">
      <div class="logo">Falência: <span>Goblins</span></div>
      <div class="info" id="barInfo"></div>
      <div class="sp"></div>
      <button class="ghost" id="btnRules">
        <svg class="i"><use href="#i-book" /></svg>Regras
      </button>
      <button class="ghost" id="btnLog">
        <svg class="i"><use href="#i-list" /></svg>Histórico
      </button>
      <button
        class="ghost"
        id="btnSpeed"
        title="Velocidade das animações: Normal ou Rápido (cerca de 2× mais rápido). Não muda as regras."
      >
        <svg class="i"><use href="#i-gauge" /></svg>Normal
      </button>
      <button class="ghost" id="btnMenu">
        <svg class="i"><use href="#i-home" /></svg>Menu
      </button>
    </header>

    <section id="menu"></section>

    <section id="lobby" class="hidden"></section>

    <section id="game" class="hidden"></section>

    <aside id="logDrawer">
      <h3>Histórico</h3>
      <div id="logList"></div>
    </aside>
    <div id="banner"></div>
    <div id="modal"></div>
    <div id="toast"></div>
    <div id="tut" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
